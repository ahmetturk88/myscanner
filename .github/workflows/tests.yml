name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.11 matches the VPS image; 3.13 matches local development.
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      # Some Python tests evaluate the JavaScript renderers through Node.
      - run: python -m pytest -q -p no:cacheprovider

  javascript:
    name: JavaScript renderers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run every Node test
        run: |
          status=0
          for test in tests/*.cjs; do
            echo "::group::$test"
            node "$test" || status=1
            echo "::endgroup::"
          done
          exit $status

  dependency-audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Reports known vulnerabilities without blocking merges until the
    # baseline is reviewed; make it blocking once findings are triaged.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pip-audit==2.9.0
      - run: pip-audit -r requirements.txt
