name: ${COMPOSE_PROJECT_NAME:-myscanner-vps-rehearsal}
x-app: &app
  image: ${VPS_IMAGE:?Prepare rehearsal configuration first}
  build:
    context: .
    dockerfile: Dockerfile.vps
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ['/tmp:uid=10001,gid=10001,mode=1770']
  mem_limit: 1g
  pids_limit: 128
  environment: &environment
    APP_ENV: production
    VPS_STACK: '1'
    FLASK_DEBUG: '0'
    TRUSTED_PROXY_CIDRS: '172.31.240.2/32'
    TRUSTED_PROXY_HOPS: '1'
    URLVET_URL: ${URLVET_URL:-http://host.docker.internal:8080}
    # Antivirus for the file scanner (service "clamav" below); empty turns it off.
    CLAMAV_HOST: ${CLAMAV_HOST-clamav}
    # Optional error alerts (Sentry); empty keeps reporting off.
    SENTRY_DSN: ${SENTRY_DSN:-}
    # In-app update prompts for the Android app (services/app_release.py); 0 turns them off.
    MOBILE_LATEST_BUILD: ${MOBILE_LATEST_BUILD:-0}
    MOBILE_MIN_BUILD: ${MOBILE_MIN_BUILD:-0}
    # Comma-separated data sources to stop contacting (services/source_switches.py), e.g. urlhaus,abuseipdb.
    MYSCANNER_DISABLED_SOURCES: ${MYSCANNER_DISABLED_SOURCES:-}
    # Local DB-IP Lite files for the IP check; fill with scripts/update_dbip.py.
    DBIP_DIRECTORY: /app/geoip
  extra_hosts: [host.docker.internal:host-gateway]
  networks: [data, outbound]
  secrets: [db_app_password, redis_password, session_key]
  volumes: [uploads:/app/temp_uploads, logs:/app/logs, reports:/app/reports, cache:/app/cache, file-cache:/app/file_cache, ./geoip:/app/geoip:ro]
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: myscanner_bootstrap
      POSTGRES_DB: myscanner_vps
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets: [db_admin_password]
    volumes: [postgres-data:/var/lib/postgresql]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U myscanner_bootstrap -d myscanner_vps']
      interval: 10s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, /run/secrets/redis_config]
    secrets: [redis_config, redis_password]
    volumes: [redis-data:/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "REDISCLI_AUTH=$$(tr -d '\\r\\n' < /run/secrets/redis_password) redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
  bootstrap-roles:
    <<: *app
    command: [bootstrap]
    networks: [data]
    secrets: [db_admin_password, db_app_password, db_migration_password]
    volumes: []
    depends_on:
      postgres: {condition: service_healthy}
  migrate:
    <<: *app
    command: [migrate]
    networks: [data]
    secrets: [db_migration_password]
    volumes: []
    depends_on:
      bootstrap-roles: {condition: service_completed_successfully}
  seed:
    <<: *app
    command: [seed]
    networks: [data]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  web:
    <<: *app
    environment:
      <<: *environment
      ABUSEIPDB_API_KEY_FILE: /run/secrets/abuseipdb_api_key
      # Social sign-in: a provider is offered only when its id and secret are set.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET_FILE: /run/secrets/github_client_secret
      # Outgoing email (verification, password reset, contact form).
      RESEND_API_KEY_FILE: /run/secrets/resend_api_key
      FROM_EMAIL: ${FROM_EMAIL:-info@myscanners.com}
      BASE_URL: https://${SITE_DOMAIN:-localhost}
      # Optional SMTP recipient probe; most hosts block outbound port 25, so it is off unless enabled.
      EMAIL_SMTP_PROBE: ${EMAIL_SMTP_PROBE:-off}
      # AI assistant: providers in fallback order; each needs its key file to be non-empty.
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      GROQ_API_KEY_FILE: /run/secrets/groq_api_key
      AI_PROVIDERS: ${AI_PROVIDERS:-gemini,groq}
      AI_GEMINI_MODEL: ${AI_GEMINI_MODEL:-gemini-flash-latest}
      AI_GROQ_MODEL: ${AI_GROQ_MODEL:-openai/gpt-oss-120b}
      AI_GEMINI_THINKING_BUDGET: ${AI_GEMINI_THINKING_BUDGET:-0}
    secrets: [db_app_password, redis_password, session_key, abuseipdb_api_key, google_client_secret, github_client_secret, resend_api_key, gemini_api_key, groq_api_key]
    command: [web]
    restart: unless-stopped
    networks:
      data: {}
      outbound: {}
      frontend: {ipv4_address: 172.31.240.3}
    depends_on:
      seed: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, scripts/vps_runtime.py, health-web]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  worker:
    <<: *app
    command: [worker]
    restart: unless-stopped
    depends_on:
      seed: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, scripts/vps_runtime.py, health-worker]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  tip-worker:
    <<: *app
    command: [tip-worker]
    restart: unless-stopped
    depends_on:
      seed: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, scripts/vps_runtime.py, health-tip-worker]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  bulk-worker:
    <<: *app
    command: [bulk-worker]
    restart: unless-stopped
    depends_on:
      seed: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, scripts/vps_runtime.py, health-bulk-worker]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  beat:
    <<: *app
    command: [beat]
    restart: unless-stopped
    networks: [data]
    volumes: [beat-state:/state]
    depends_on:
      seed: {condition: service_completed_successfully}
  # Antivirus engine for the file scanner. freshclam updates the signatures over
  # "outbound"; scanners reach clamd on the internal "data" network, port 3310.
  # One database copy in memory (no concurrent reload) keeps it near 1.2 GB.
  clamav:
    image: clamav/clamav:1.5
    restart: unless-stopped
    mem_limit: 2g
    pids_limit: 256
    security_opt: [no-new-privileges:true]
    environment:
      FRESHCLAM_CHECKS: '12'
      CLAMD_CONF_StreamMaxLength: 51M
      CLAMD_CONF_MaxFileSize: 51M
      CLAMD_CONF_MaxScanSize: 200M
      # Big apps unpack into thousands of files; finish before the client's limit (clamav_client.scan_timeout).
      CLAMD_CONF_MaxScanTime: '160000'
      CLAMD_CONF_MaxFiles: '20000'
      CLAMD_CONF_ConcurrentDatabaseReload: 'no'
    volumes: [clamav-db:/var/lib/clamav]
    networks: [data, outbound]
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - '${HTTP_BIND:-127.0.0.1:8088}:80'
      - '${HTTPS_BIND:-127.0.0.1:8443}:443'
    volumes: [./deploy/Caddyfile:/etc/caddy/Caddyfile:ro, caddy-data:/data, caddy-config:/config]
    networks:
      frontend: {ipv4_address: 172.31.240.2}
      outbound: {}
    depends_on:
      web: {condition: service_healthy}
networks:
  data: {internal: true}
  frontend:
    internal: true
    ipam:
      config: [{subnet: 172.31.240.0/24}]
  outbound: {}
volumes:
  postgres-data: {}
  redis-data: {}
  uploads: {}
  logs: {}
  reports: {}
  cache: {}
  file-cache: {}
  clamav-db: {}
  beat-state: {}
  caddy-data: {}
  caddy-config: {}
secrets:
  db_admin_password: {file: '${SECRET_DIRECTORY:?Prepare secrets}/db_admin_password'}
  db_app_password: {file: '${SECRET_DIRECTORY:?Prepare secrets}/db_app_password'}
  db_migration_password: {file: '${SECRET_DIRECTORY:?Prepare secrets}/db_migration_password'}
  redis_password: {file: '${SECRET_DIRECTORY:?Prepare secrets}/redis_password'}
  redis_config: {file: '${SECRET_DIRECTORY:?Prepare secrets}/redis_config'}
  session_key: {file: '${SECRET_DIRECTORY:?Prepare secrets}/session_key'}

  abuseipdb_api_key: {file: '${SECRET_DIRECTORY:?Prepare secrets}/abuseipdb_api_key'}
  google_client_secret: {file: '${SECRET_DIRECTORY:?Prepare secrets}/google_client_secret'}
  github_client_secret: {file: '${SECRET_DIRECTORY:?Prepare secrets}/github_client_secret'}
  resend_api_key: {file: '${SECRET_DIRECTORY:?Prepare secrets}/resend_api_key'}
  gemini_api_key: {file: '${SECRET_DIRECTORY:?Prepare secrets}/gemini_api_key'}
  groq_api_key: {file: '${SECRET_DIRECTORY:?Prepare secrets}/groq_api_key'}
