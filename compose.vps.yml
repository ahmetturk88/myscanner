name: ${COMPOSE_PROJECT_NAME:-myscanner-vps-rehearsal}
x-app: &app
  image: ${VPS_IMAGE:?Prepare rehearsal configuration first}
  build:
    context: .
    dockerfile: Dockerfile.vps
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ['/tmp:uid=10001,gid=10001,mode=1770']
  mem_limit: 1g
  pids_limit: 128
  environment: &environment
    APP_ENV: production
    VPS_STACK: '1'
    FLASK_DEBUG: '0'
    TRUSTED_PROXY_CIDRS: '172.31.240.2/32'
    TRUSTED_PROXY_HOPS: '1'
    URLVET_URL: ${URLVET_URL:-http://host.docker.internal:8080}
  extra_hosts: [host.docker.internal:host-gateway]
  networks: [data, outbound]
  secrets: [db_app_password, redis_password, session_key]
  volumes: [uploads:/app/temp_uploads, logs:/app/logs, reports:/app/reports, cache:/app/cache, file-cache:/app/file_cache]
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: myscanner_bootstrap
      POSTGRES_DB: myscanner_vps
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets: [db_admin_password]
    volumes: [postgres-data:/var/lib/postgresql]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U myscanner_bootstrap -d myscanner_vps']
      interval: 10s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, /run/secrets/redis_config]
    secrets: [redis_config, redis_password]
    volumes: [redis-data:/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "REDISCLI_AUTH=$$(tr -d '\\r\\n' < /run/secrets/redis_password) redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
  bootstrap-roles:
    <<: *app
    command: [bootstrap]
    networks: [data]
    secrets: [db_admin_password, db_app_password, db_migration_password]
    volumes: []
    depends_on:
      postgres: {condition: service_healthy}
  migrate:
    <<: *app
    command: [migrate]
    networks: [data]
    secrets: [db_migration_password]
    volumes: []
    depends_on:
      bootstrap-roles: {condition: service_completed_successfully}
  seed:
    <<: *app
    command: [seed]
    networks: [data]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  web:
    <<: *app
    command: [web]
    restart: unless-stopped
    networks:
      data: {}
      outbound: {}
      frontend: {ipv4_address: 172.31.240.3}
    depends_on:
      seed: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, scripts/vps_runtime.py, health-web]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  worker:
    <<: *app
    command: [worker]
    restart: unless-stopped
    depends_on:
      seed: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, scripts/vps_runtime.py, health-worker]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  beat:
    <<: *app
    command: [beat]
    restart: unless-stopped
    networks: [data]
    volumes: [beat-state:/state]
    depends_on:
      seed: {condition: service_completed_successfully}
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    ports:
      - '${HTTP_BIND:-127.0.0.1:8088}:80'
      - '${HTTPS_BIND:-127.0.0.1:8443}:443'
    volumes: [./deploy/Caddyfile:/etc/caddy/Caddyfile:ro, caddy-data:/data, caddy-config:/config]
    networks:
      frontend: {ipv4_address: 172.31.240.2}
      outbound: {}
    depends_on:
      web: {condition: service_healthy}
networks:
  data: {internal: true}
  frontend:
    internal: true
    ipam:
      config: [{subnet: 172.31.240.0/24}]
  outbound: {}
volumes:
  postgres-data: {}
  redis-data: {}
  uploads: {}
  logs: {}
  reports: {}
  cache: {}
  file-cache: {}
  beat-state: {}
  caddy-data: {}
  caddy-config: {}
secrets:
  db_admin_password: {file: '${SECRET_DIRECTORY:?Prepare secrets}/db_admin_password'}
  db_app_password: {file: '${SECRET_DIRECTORY:?Prepare secrets}/db_app_password'}
  db_migration_password: {file: '${SECRET_DIRECTORY:?Prepare secrets}/db_migration_password'}
  redis_password: {file: '${SECRET_DIRECTORY:?Prepare secrets}/redis_password'}
  redis_config: {file: '${SECRET_DIRECTORY:?Prepare secrets}/redis_config'}
  session_key: {file: '${SECRET_DIRECTORY:?Prepare secrets}/session_key'}
