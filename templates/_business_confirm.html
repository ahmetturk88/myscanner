{# The styled confirmation used by every MyScanner İşletme page: forms with data-confirm ask here first. #}
<style>
  .bzc{position:fixed;inset:0;margin:auto;height:fit-content;border:0;padding:0;background:transparent;max-width:min(460px,calc(100vw - 32px));width:100%}
  .bzc::backdrop{background:rgba(3,8,16,.72);backdrop-filter:blur(4px)}
  .bzc-box{padding:24px 24px 20px;border-radius:20px;border:1px solid rgba(119,220,255,.28);background:linear-gradient(160deg,#10203a,#0a1424);box-shadow:0 30px 90px -30px rgba(0,0,0,.8);color:#eef6ff}
  .bzc-box h3{display:flex;align-items:center;gap:10px;font-size:19px;margin:0;color:#eef6ff}
  .bzc-box h3 .pg-ic{color:#fbbf24}
  .bzc-text{margin:12px 0 20px;color:#c9d8ea;font-size:15.5px;line-height:1.6}
  .bzc-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
</style>
<dialog class="bzc" id="bz-confirm" aria-labelledby="bzc-title">
  <div class="bzc-box">
    <h3 id="bzc-title"><span class="pg-ic ic-alert"></span>{{ t.confirm_title }}</h3>
    <p class="bzc-text"></p>
    <div class="bzc-actions"><button type="button" class="pg-btn bzc-no">{{ t.confirm_no }}</button><button type="button" class="pg-btn primary bzc-yes">{{ t.confirm_yes }}</button></div>
  </div>
</dialog>
<script>
(function () {
  // One styled confirmation for every action that asks first (the browser's own box shows the site address as its title).
  var dialog = document.getElementById('bz-confirm');
  var pending = null;
  document.querySelectorAll('form[data-confirm]').forEach(function (form) {
    form.addEventListener('submit', function (event) {
      if (form.dataset.confirmed === '1' || !dialog || typeof dialog.showModal !== 'function') {
        if (!dialog && !window.confirm(form.dataset.confirm)) event.preventDefault();
        return;
      }
      event.preventDefault();
      pending = form;
      dialog.querySelector('.bzc-text').textContent = form.dataset.confirm;
      dialog.showModal();
      dialog.querySelector('.bzc-yes').focus();
    });
  });
  if (!dialog) return;
  dialog.querySelector('.bzc-yes').addEventListener('click', function () {
    dialog.close();
    if (pending) { pending.dataset.confirmed = '1'; pending.requestSubmit ? pending.requestSubmit() : pending.submit(); }
  });
  dialog.querySelector('.bzc-no').addEventListener('click', function () { pending = null; dialog.close(); });
  dialog.addEventListener('click', function (event) { if (event.target === dialog) { pending = null; dialog.close(); } });
})();
</script>
